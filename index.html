<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8a5a1c">
<link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<title>الماجد للعود – أداء الموظفين</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--tx:#2a2118;--mut:#7a6d5e;--ac:#8a5a1c;--bd:#e6dccb;--ok:#1f7a4d;--bad:#b3261e;--mid:#b7791f}
@media (prefers-color-scheme:dark){:root{--bg:#17130e;--card:#221c14;--tx:#f1e9dc;--mut:#b2a591;--ac:#c58a3d;--bd:#3a3023;--ok:#4cc38a;--bad:#ff8a80;--mid:#e8b04b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,system-ui,sans-serif;line-height:1.6;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 2px;color:var(--ac)}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:12px;border:1px solid var(--bd);border-radius:10px;background:#fff8d6;color:#2a2118;font:inherit}
.btn{width:100%;margin-top:14px;padding:12px;border:0;border-radius:10px;background:var(--ac);color:#fff;font:inherit;font-weight:700}
.out{background:none;border:1px solid var(--bd);color:var(--mut);width:auto;padding:6px 14px;margin:0;font-size:13px}
.top{display:flex;justify-content:space-between;align-items:center}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--bg);border-radius:10px;padding:10px;text-align:center}.kpi b{display:block;font-size:18px}.kpi span{font-size:12px;color:var(--mut)}
.bar{height:10px;background:var(--bd);border-radius:6px;overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;background:var(--ac)}
.scroll{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px;min-width:520px}
th,td{padding:8px 6px;text-align:center;border-bottom:1px solid var(--bd)}th{color:var(--mut);font-weight:600}
.r-ممتاز{color:var(--ok);font-weight:700}.r-جيد{color:var(--mid);font-weight:700}.r-ضعيف{color:var(--bad);font-weight:700}
.note{font-size:13px;color:var(--mut);text-align:center;margin-top:8px}.err{color:var(--bad)}.hide{display:none}
</style></head><body><div class="wrap">
<h1>الماجد للعود</h1><div class="sub">فرع وادي الدواسر · متابعة أداء الموظفين</div>

<div id="login" class="card">
<label>رقم الموظف (أو manager للمدير)</label><input id="u" autocomplete="username" inputmode="text">
<label>كلمة السر</label><input id="p" type="password" autocomplete="current-password">
<button class="btn" id="go">دخول</button><div id="le" class="note err"></div>
</div>

<div id="emp" class="hide">
<div class="top"><b id="who"></b><button class="btn out" id="o1">خروج</button></div>
<div class="card">
<label>مبيعاتي 2026 (ريال)</label><input id="sales" type="number" inputmode="decimal">
<label>عدد الفواتير</label><input id="inv" type="number" inputmode="numeric">
<label>عدد القطع المباعة</label><input id="pcs" type="number" inputmode="numeric">
<button class="btn" id="save">حفظ وإرسال للمدير</button><div id="sv" class="note"></div>
</div>
<div class="card hide" id="mine"></div>
</div>

<div id="mgr" class="hide">
<div class="top"><b>لوحة المدير</b><button class="btn out" id="o2">خروج</button></div>
<div class="card" style="margin-top:10px"><div class="kpis" id="bk"></div><div class="bar"><i id="bb" style="width:0"></i></div></div>
<div class="card scroll"><table><thead><tr><th>#</th><th>الموظف</th><th>المبيعات</th><th>الفواتير</th><th>متوسط الفاتورة</th><th>UPT</th><th>التقييم</th><th>آخر تحديث</th></tr></thead><tbody id="tb"></tbody></table></div>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,collection,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ===== الصق هنا إعدادات Firebase الخاصة بك =====
const firebaseConfig={apiKey:"AIzaSyBuvffLYZ1a7MM41alt89niw_v5gZM0QYI",authDomain:"al-majed-for-oud.firebaseapp.com",projectId:"al-majed-for-oud",storageBucket:"al-majed-for-oud.firebasestorage.app",messagingSenderId:"321292491475",appId:"1:321292491475:web:e67506fe9a6ea717629226"};
// ===============================================
const DOMAIN="@almajed-oud.app",TARGET=540497;
const STAFF={"7033":"إياد محمد سيف","6925":"عبدالعالي الدوسري","11977":"مجدي عبدالله","14966":"راشد الدوسري","13090":"محمد الدوسري"};

const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app);
const $=id=>document.getElementById(id);
const n=v=>Number(v||0).toLocaleString('en-US',{maximumFractionDigits:2});
const rate=u=>u>=2.8?'ممتاز':u>=2?'جيد':'ضعيف';
let unsub=null;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});

$('go').onclick=async()=>{
  $('le').textContent='';
  try{await signInWithEmailAndPassword(auth,$('u').value.trim().toLowerCase()+DOMAIN,$('p').value)}
  catch(e){$('le').textContent='الرقم أو كلمة السر غير صحيحة'}
};
$('o1').onclick=$('o2').onclick=()=>signOut(auth);

function mineHtml(d){const u=d.inv>0?d.pcs/d.inv:0,a=d.inv>0?d.sales/d.inv:0;
 return `<div class="kpis"><div class="kpi"><b>${n(d.sales)}</b><span>مبيعاتي</span></div><div class="kpi"><b>${n(a)}</b><span>متوسط الفاتورة</span></div><div class="kpi"><b>${u.toFixed(2)}</b><span>UPT</span></div><div class="kpi"><b class="r-${rate(u)}">${rate(u)}</b><span>تقييم UPT</span></div></div>`}

function renderMgr(snap){
 const rows=snap.docs.map(d=>d.data()).sort((a,b)=>b.sales-a.sales);
 const tot=rows.reduce((s,r)=>s+r.sales,0),pct=tot/TARGET*100;
 $('bk').innerHTML=`<div class="kpi"><b>${n(tot)}</b><span>إجمالي الفرع</span></div><div class="kpi"><b>${n(TARGET)}</b><span>التارجت</span></div><div class="kpi"><b>${pct.toFixed(1)}%</b><span>نسبة التحقيق</span></div><div class="kpi"><b>${n(Math.max(TARGET-tot,0))}</b><span>المتبقي</span></div>`;
 $('bb').style.width=Math.min(pct,100)+'%';
 $('tb').innerHTML=rows.length?rows.map((r,i)=>{const u=r.inv>0?r.pcs/r.inv:0,a=r.inv>0?r.sales/r.inv:0;
  return `<tr><td>${i+1}</td><td>${STAFF[r.code]||r.code}</td><td>${n(r.sales)}</td><td>${n(r.inv)}</td><td>${n(a)}</td><td>${u.toFixed(2)}</td><td class="r-${rate(u)}">${rate(u)}</td><td>${new Date(r.at).toLocaleDateString('en-GB')}</td></tr>`}).join(''):'<tr><td colspan="8" class="note">لا توجد بيانات بعد</td></tr>';
}

onAuthStateChanged(auth,async user=>{
 if(unsub){unsub();unsub=null}
 ['login','emp','mgr'].forEach(i=>$(i).classList.add('hide'));
 if(!user){$('login').classList.remove('hide');return}
 const id=user.email.split('@')[0];
 if(id==='manager'){
  $('mgr').classList.remove('hide');
  unsub=onSnapshot(collection(db,'entries'),renderMgr,()=>{});
 }else{
  $('emp').classList.remove('hide');$('who').textContent=STAFF[id]||id;
  const ref=doc(db,'entries',id);
  try{const s=await getDoc(ref);if(s.exists()){const d=s.data();$('sales').value=d.sales;$('inv').value=d.inv;$('pcs').value=d.pcs;$('mine').innerHTML=mineHtml(d);$('mine').classList.remove('hide');$('sv').textContent='آخر حفظ: '+new Date(d.at).toLocaleString('en-GB')}}catch(e){}
  $('save').onclick=async()=>{
   const sales=+$('sales').value,inv=+$('inv').value,pcs=+$('pcs').value;
   if(!(sales>=0)||!(inv>0)||!(pcs>=0)||!$('sales').value){$('sv').textContent='أكمل كل الحقول';return}
   const d={code:id,sales,inv,pcs,at:Date.now()};
   try{await setDoc(ref,d);$('mine').innerHTML=mineHtml(d);$('mine').classList.remove('hide');$('sv').textContent='تم الحفظ ✓'}
   catch(e){$('sv').textContent='تعذّر الحفظ، تأكد من الاتصال'}
  };
 }
});
</script></div></body></html>
